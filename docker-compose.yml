name: linglow-chat-community

services:
  app:
    container_name: linglow-chat-community-app
    build: .
    image: wanyuhuang/linglow-chat-community-app:v0.9.0
    ports:
      - "8816:3000"
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${PORT:-3000}
      - DB_HOST=mysql
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=${DB_NAME:-linglow_chat}
      - SESSION_SECRET=${SESSION_SECRET}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-123456}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_MAILTO=${VAPID_MAILTO:-}
    restart: unless-stopped
    networks:
      - linglow-network

  adminer:
    image: adminer:latest
    # 3. 修改容器名称
    container_name: linglow-chat-community-adminer
    ports:
      - "8817:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=mysql
      - ADMINER_DESIGN=pepa-linha-dark
    depends_on:
      - mysql
    restart: unless-stopped
    networks:
      - linglow-network

  mysql:
    image: mysql:8.0
    # 4. 修改容器名称
    container_name: linglow-chat-community-mysql
    command: --default-authentication-plugin=mysql_native_password --max_allowed_packet=256M --innodb-buffer-pool-size=512M
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
      - MYSQL_DATABASE=${DB_NAME:-linglow_chat}
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD}"]
      timeout: 20s
      retries: 10
    restart: unless-stopped
    networks:
      - linglow-network

networks:
  linglow-network:
    driver: bridge

volumes:
  mysql-data: